name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'core/src/main/scala/com/amadeus/perfgazer/reports/**', 'core/src/main/scala/com/amadeus/perfgazer/schema/**', 'doc-generator/**']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1.5.5

      - run: pip install mkdocs mkdocs-material mike

      - name: Build docs
        run: ./scripts/docs-build.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy dev (on push to main)
        if: github.event_name == 'push'
        run: |
          mike deploy --push dev
          mike set-default --push dev

      - name: Deploy release version
        if: github.event_name == 'release'
        run: |
          mike deploy --push --update-aliases ${{ github.event.release.tag_name }} latest
          mike set-default --push latest
