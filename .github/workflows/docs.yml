name: Deploy Docs

on:
  push:
    branches: [main, doc-site]  # TODO: remove 'doc-site' after testing
    paths: ['docs/**', 'mkdocs.yml']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mkdocs mkdocs-material mike

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy dev (on push to main)
        if: github.event_name == 'push'
        run: |
          mike deploy --push dev
          mike set-default --push dev

      - name: Deploy release version
        if: github.event_name == 'release'
        run: |
          mike deploy --push --update-aliases ${{ github.event.release.tag_name }} latest
          mike set-default --push latest
