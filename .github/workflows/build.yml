name: Scala CI/CD Pipeline
on:
  push:
    branches: [ "main", "hotfix/*", "feature/*" ]
  pull_request:
    branches: [ "main", "hotfix/*", "release/*" ]

permissions:
  contents: write # Required to upload dependency graph

jobs:
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        run: echo "matrix=$(jq -c '{include:.}' .github/artifact-matrix.json)" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: load-matrix
    runs-on: ubuntu-latest
    name: Build and Test (Spark ${{ matrix.spark }})
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    env:
      SPARK_VERSION: ${{ matrix.spark }}
      SCALA_VERSION: ${{ matrix.scala }}
      SCALA_BINARY: ${{ matrix.scala_binary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache sbt dependencies
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build
        run: |
          sbt -batch -Dspark.perfgazer.sparkVersion=$SPARK_VERSION -Dspark.perfgazer.scalaVersion=$SCALA_VERSION clean compile

      - name: Unit Tests
        run: |
          sbt -batch -Dspark.perfgazer.sparkVersion=$SPARK_VERSION -Dspark.perfgazer.scalaVersion=$SCALA_VERSION coverageOn test coverageReport coverageAggregate

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/scala-${{ env.SCALA_BINARY }}/coverage-report/cobertura.xml
          flags: spark-${{ matrix.spark }}
          verbose: true

      # This step uploads information to the GitHub dependency graph and unlocks Dependabot alerts for the repository
      - name: Upload dependency graph
        uses: scalacenter/sbt-dependency-submission@v3
        if: github.event_name != 'pull_request'
