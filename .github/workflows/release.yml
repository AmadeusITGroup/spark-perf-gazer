name: Release
on:
  push:
    tags: ["v*"]

jobs:
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: set
        run: echo "matrix=$(jq -c '{include:.}' .github/artifact-matrix.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: load-matrix
    runs-on: ubuntu-latest
    name: Release (Spark ${{ matrix.spark }})
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.load-matrix.outputs.matrix) }}
    env:
      SPARK_VERSION: ${{ matrix.spark }}
      SCALA_VERSION: ${{ matrix.scala }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Release on Maven Central
        run: sbt -Dspark.perfgazer.sparkVersion=$SPARK_VERSION -Dspark.perfgazer.scalaVersion=$SCALA_VERSION ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.OSSRH_USERNAME }}
